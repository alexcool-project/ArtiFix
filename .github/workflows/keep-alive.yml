name: Keep ArtiFix Alive

on:
  schedule:
    # Every 3 hours (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up ArtiFix app
        run: |
          echo "Svegliando ArtiFix..."
          echo "Timestamp: $(date -u)"

          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --max-time 60 \
            --max-redirs 0 \
            --connect-timeout 30 \
            https://artifix.streamlit.app || echo "000")

          echo "HTTP Status Code: $HTTP_CODE"

          if [ "$HTTP_CODE" != "000" ]; then
            echo "✅ ArtiFix ha ricevuto il ping ed è stata svegliata"
            exit 0
          else
            echo "⚠️ ArtiFix non ha risposto al ping"
            exit 1
          fi
