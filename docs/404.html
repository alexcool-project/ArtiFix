<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina non trovata — ArtiFix</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="https://i.postimg.cc/bvp2nKwt/Archi-Fix-cubo-logo.png" />
    <link rel="stylesheet" href="styles.css" />
    <style>
        .error-page {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: #1f77b4;
            line-height: 1;
            margin-bottom: 16px;
        }
        .error-page h1 {
            font-size: 2rem;
            margin-bottom: 12px;
            color: #0d1b2a;
        }
        .error-page p {
            color: #555;
            font-size: 1.05rem;
            margin-bottom: 32px;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="container">
            <div class="error-code">404</div>
            <h1>Pagina non trovata</h1>
            <p>La pagina che stai cercando non esiste o è stata spostata.</p>
            <a href="/" class="btn btn-primary btn-large">← Torna alla Home</a>
            &nbsp;
            <a href="https://artifix.streamlit.app/" class="btn btn-secondary btn-large" target="_blank" rel="noopener">Apri ArtiFix →</a>
        </div>
    </div>
</body>
</html>
