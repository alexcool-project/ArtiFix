<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avvio ArtiFix — Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="images/ArchiFix_cubo-logo.png" />
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: system-ui, sans-serif;
        }
        .loader-box {
            text-align: center;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
        }
        .spinner {
            border: 4px solid #e2e8f0;
            border-top: 4px solid #0284c7;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader-box">
        <img src="images/Artifix_logo.png" alt="ArtiFix" style="width: 120px; margin-bottom: 15px;">
        <h2>Sto preparando ArtiFix...</h2>
        <p style="color: #64748b; font-size: 14px; margin-top: 5px;">L'applicazione si sta avviando.<br>Attendere qualche secondo...</p>
        <div class="spinner"></div>
        <p style="font-size: 12px; color: #94a3b8; margin-top: 15px;">Powered by ArtiFix</p>
    </div>
    <script>
        // Reindirizzamento alla dashboard classica di ArtiFix dopo il caricamento
        setTimeout(function() {
            window.location.href = "app.py"; // o alla pagina principale della dashboard
        }, 2000);
    </script>
</body>
</html>
