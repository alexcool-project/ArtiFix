<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apertura OmniBrain PRO Demo — ArtiFix</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="images/ArchiFix_cubo-logo.png" />
    <meta http-equiv="refresh" content="2;url=https://artifix.streamlit.app">
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: system-ui, sans-serif;
        }
        .loader-box {
            text-align: center;
            background: #111827;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #1f2937;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
        }
        .spinner {
            border: 4px solid #1f2937;
            border-top: 4px solid #7c3aed;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader-box">
        <img src="images/Artifix_logo.png" alt="ArtiFix" style="width: 120px; margin-bottom: 15px;">
        <h2>Preparazione OmniBrain PRO...</h2>
        <p style="color: #9ca3af; font-size: 14px; margin-top: 5px;">Caricamento ambiente demo isolato in corso. Attendere...</p>
        <div class="spinner"></div>
        <p style="font-size: 12px; color: #6b7280; margin-top: 15px;">Modello STL precaricato protetto attivo.</p>
    </div>
    <script>
        // Fallback di reindirizzamento via JS dopo 2 secondi
        setTimeout(function() {
            window.location.href = "https://artifix.streamlit.app";
        }, 2000);
    </script>
</body>
</html>
